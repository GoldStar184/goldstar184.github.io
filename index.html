  <body>
    <style contenteditable>
        style {
          color: inherit;
          display:block;
          border: 1px solid;
          font: inherit;
          font-family: monospace;
          padding:1em;
          border-radius: 1em;
          white-space: pre;
        }

    <header>
      <h1 href="https://goldstar184.github.io/">GoldStar184.github.io</h1>

    <main>
    <section id="about">
    <h2>About</h2>
    <P> Test 124</P>
    <p>Hello world!</p>
    <button class="btn" id="btn">Run Python</button>
    <div id="editor">print("hello world!")
    </div>
    <div id="shell">
    </div>
    <script>
      var editor = ace.edit("editor");
      editor.setOptions({
      highlightActiveLine: true,
      highlightSelectedWord: true,
      enableAutoIndent: true,
      useSoftTabs: true,
      theme: "ace/theme/github_dark",
      mode: "ace/mode/python",
      maxLines: 100
      });
  
      let pyodide = await loadPyodide();
      
      var term = new Terminal();
      term.open(document.getElementById('shell'));
      
      pyodide.setStdout({ batched: (msg) => term.write(msg) });
      pyodide.setStderr({ batched: (msg) => term.write("\\033[31m " + msg + "\\033[0m") });
      document.getElementById("btn").onclick = function () { pyodide.runPython(editor.getValue()); }; };
        
      term.write("loaded!");
      
    </script>
    </section>
    <section>
      This is a website where im learning HTML, so.... yeah.

    </main>
